name = ragdoll
title = Ragdoll
description = Bodies fall as physics ragdolls when players and mobs die, instead of death animations or vanishing. Works with any skinned model and most mob APIs (Mobs Redo, mcl_mobs, mobkit, mob_core, Creatura, all_mobs_api) in any game.
author = epCode
license = MIT
